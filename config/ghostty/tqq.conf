# TQQ dark glass appearance for Ghostty. Colors in tqq-colors.conf are wallpaper-derived.
font-family = JetBrains Mono
font-size = 11
window-padding-x = 12
window-padding-y = 10
window-padding-balance = true
window-decoration = auto
background-opacity = 0.90
# Niri does not guarantee the Ghostty app-specific background blur API.
background-blur = false
cursor-style = bar
cursor-style-blink = false
mouse-hide-while-typing = true
config-file = tqq-colors.conf
