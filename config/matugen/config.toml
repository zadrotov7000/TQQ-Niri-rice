[config]
reload_apps = false

[config.wallpaper]
set = false
command = "true"

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'

[templates.dunst]
input_path = '~/.config/matugen/templates/dunstrc'
output_path = '~/.config/dunst/dunstrc'

[templates.tqq]
input_path = '~/.config/matugen/templates/tqq-colors.json'
output_path = '~/.config/tqq-niri-rice/colors.json'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/tqq-colors.conf'

[templates.ghostty]
input_path = '~/.config/matugen/templates/ghostty-colors.conf'
output_path = '~/.config/ghostty/tqq-colors.conf'

[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch.jsonc'
output_path = '~/.config/fastfetch/tqq.jsonc'
