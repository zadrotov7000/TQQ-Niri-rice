include=~/.config/fuzzel/colors.ini

[main]
font=JetBrainsMono Nerd Font:size=11
layer=overlay
anchor=top
y-margin=105
width=46
lines=6
horizontal-pad=20
vertical-pad=14
inner-pad=9
line-height=34
prompt="    "
placeholder="Search applications..."
match-mode=fuzzy
show-actions=yes
exit-on-keyboard-focus-loss=yes

[border]
width=1
radius=15